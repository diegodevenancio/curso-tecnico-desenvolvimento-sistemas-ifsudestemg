<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estrutura HTML</title>
</head>
<body>
    <!-- Headings -->
    <h1>Um tag H1</h1>
    <h2>Um tag H2</h2>
    <h3>Um tag H3</h3>

    <!-- Parágrafos -->
     <p>Esté é um parágrafo</p>

    <!-- Tag de link -->
     <a href="https://www.horadecodar.com.br" target="_blank">Ir para o Hora de Codar</a>
    
    <!-- Quebra de linha -->
     <br>

    <!-- Lista Ordenada -->
     <ol>
        <li>Primeiro</li>
        <li>Segundo</li>
        <li>Terceiro</li>
     </ol>
      
    <!-- Quebra de linha -->
     <hr>

    <!-- Lista Desordenada -->
     <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
     </ul>
       
    <!-- Quebra de linha -->
     <hr>
    
    <!-- Texto em negrito -->
     <p>Uma palavra <b>forte</b>.</p>
     <p>Uma palavra <strong>forte</strong>.</p>

    <!-- Texto em itálico -->
     <p>Parágrafo com <i>ênfase</i>.</p>
     <p>Parágrafo com <em>ênfase</em>.</p>

    

    <!-- Imagens -->
     <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA8lkuAi7c79dZIlnobyV3PvqUincwBic_fm0KfvzlgQ&s=10" alt="Html 5 - Logo">
    
</body>
</html>
